<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sacred Oracles — Ancient wisdom through Yi Jing Tu (I Ching) and Ashtamangala Prasna (Vedic Horary astrology)">
  <meta name="color-scheme" content="dark light">
  <title>Sacred Oracles · Yi Jing &amp; Ashtamangala</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { color-scheme: dark; --bg: #05050a; --fg: #e2e8f0; --accent: #e6b422; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
  #bootloader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999; background: var(--bg); }
  #bootloader::after { content: ''; width: 32px; height: 32px; border: 3px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style></head>
<body>
  <div id="approot"><div id="bootloader"></div></div>
  <script src="https://gassahara.github.io/pipelines/js/bootloader.js"></script>
  <script src="appinit.js"></script>
<script>window.addEventListener('DOMContentLoaded', function() { var b = document.getElementById('bootloader'); if (b && b.parentNode === document.getElementById('approot')) setTimeout(function() { b.style.display = 'none'; }, 200); });</script>
</body>

</html>
